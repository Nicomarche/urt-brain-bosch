<div class="startup-move">
  <div class="startup-move-status" [class.startup-move-status--error]="status.error">
    <span>{{ statusLabel }}</span>
    <span>{{ durationLabel }} - {{ status.samples || 0 }}</span>
  </div>

  <div class="startup-move-actions">
    <button
      class="startup-move-button startup-move-button--primary"
      [class.startup-move-button--recording]="isRecording"
      [disabled]="!canStart && !canStop"
      (click)="toggleRecording()"
    >
      {{ primaryLabel }}
    </button>
    <button
      class="startup-move-button startup-move-button--clear"
      [disabled]="!canClear"
      (click)="clear()"
    >
      Borrar
    </button>
  </div>
</div>
